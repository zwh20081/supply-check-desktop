name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sidecar:
    name: Sidecar (Go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - name: Vet
        working-directory: sidecar
        run: go vet ./...

      # -race 很重要：并发是请求级的，所有模型 goroutine 同时写 reports[]
      # 并共享计数器，数据竞争只有在这里才抓得到。
      - name: Test
        working-directory: sidecar
        run: go test -race ./...

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # 六个 target 全过一遍，避免 release 时才发现某个平台编不出来
      - name: Cross-compile all targets
        run: |
          for target in \
            x86_64-pc-windows-msvc \
            aarch64-pc-windows-msvc \
            x86_64-apple-darwin \
            aarch64-apple-darwin \
            x86_64-unknown-linux-gnu \
            aarch64-unknown-linux-gnu
          do
            echo "::group::$target"
            bun scripts/build-sidecar.ts --target="$target"
            echo "::endgroup::"
          done

  frontend:
    name: Frontend (tsc + vite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck and build
        run: bun run frontend:build

  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # Tauri 在 Linux 上需要 WebKitGTK 与相关系统库
      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install
        run: bun install --frozen-lockfile

      # externalBin 要求产物存在才能通过 Tauri 的配置校验
      - name: Build sidecar
        run: bun run sidecar:build

      - name: Cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml
