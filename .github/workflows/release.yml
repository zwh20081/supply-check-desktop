name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.1). Creates a draft release.'
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi

          - label: Windows arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            bundles: msi

          - label: macOS x64
            os: macos-latest
            target: x86_64-apple-darwin
            bundles: dmg

          - label: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg

          - label: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage

          # arm64 Linux 用交叉编译。Tauri 的 GTK/WebKit 依赖需要 arm64 版
          # 系统库，所以要装 crossbuild 工具链并给 pkg-config 换 sysroot。
          # AppImage 的打包工具本身跑在 amd64 上，交叉场景下不可靠，只出 deb。
          - label: Linux arm64
            os: ubuntu-22.04
            target: aarch64-unknown-linux-gnu
            bundles: deb
            cross: true

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-go@v5
        with:
          go-version-file: sidecar/go.mod
          cache-dependency-path: sidecar/go.sum

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}

      - name: Install Linux deps
        if: startsWith(matrix.os, 'ubuntu') && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: Install Linux arm64 cross deps
        if: matrix.cross
        run: |
          sudo dpkg --add-architecture arm64
          # 交叉编译时 amd64 源不提供 arm64 包，需要把主源限定到 amd64
          # 再单独加 ports 源，否则 apt update 会大量 404。
          sudo sed -i 's/^deb /deb [arch=amd64] /' /etc/apt/sources.list
          sudo tee /etc/apt/sources.list.d/arm64.list >/dev/null <<'EOF'
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy main restricted universe multiverse
          deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports jammy-updates main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libwebkit2gtk-4.1-dev:arm64 libgtk-3-dev:arm64 \
            librsvg2-dev:arm64 libappindicator3-dev:arm64 patchelf

      - name: Install
        run: bun install --frozen-lockfile

      - name: Build sidecar
        run: bun scripts/build-sidecar.ts --target=${{ matrix.target }}

      - name: Build app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 交叉链接需要显式指定 linker 与 arm64 的 pkg-config
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross && 'aarch64-linux-gnu-gcc' || '' }}
          PKG_CONFIG_SYSROOT_DIR: ${{ matrix.cross && '/' || '' }}
          PKG_CONFIG_PATH: ${{ matrix.cross && '/usr/lib/aarch64-linux-gnu/pkgconfig' || '' }}
          PKG_CONFIG_ALLOW_CROSS: ${{ matrix.cross && '1' || '' }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: Supply Check ${{ github.event.inputs.tag || github.ref_name }}
          releaseBody: |
            Fill in an API base URL and key, then run the full 22-probe suite
            against every model using the vendor's official SDK.

            Pick the installer for your platform: `.msi` on Windows, `.dmg` on
            macOS, `.AppImage` or `.deb` on Linux. The UI ships in English and
            Chinese and follows your system language on first launch.

            Neither the macOS nor the Windows build is code-signed, so the first
            launch needs a manual override.
          releaseDraft: true
          prerelease: false
          # 显式限定 bundle 类型：tauri.conf.json 里是 "all"，在 Linux 上会
          # 连 rpm 一起打，而 rpm 在 Ubuntu runner 上常因缺依赖而失败。
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
